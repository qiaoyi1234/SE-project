<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<title>商品详情</title></head>
<body><div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● ⌁ ▭</span></div>
  <div class="navbar"><span class="back">‹</span><span class="title">商品详情</span><span class="right">⋯</span></div>

  <div style="height:250px;background:linear-gradient(135deg,#A7C0E8,#6E8FC7);display:flex;
              align-items:center;justify-content:center;font-size:70px;">⌨️</div>

  <div style="padding:14px 14px 0;">
    <div class="card" style="padding:14px;">
      <div class="between">
        <div class="price"><span class="sym">¥</span><span class="num" style="font-size:26px;">120</span>
          <span style="font-size:12px;color:#9AA2B1;font-weight:400;margin-left:8px;">原价 299</span></div>
        <span class="badge green">已发布</span>
      </div>
      <div style="font-size:16px;font-weight:600;line-height:23px;margin-top:8px;">
        罗技 K380 蓝牙键盘，九成新，手感很好
      </div>
      <div class="row" style="gap:6px;margin-top:10px;">
        <span class="badge gray">数码</span>
        <span class="badge gray">可小刀</span>
        <span class="badge gray">校内自提</span>
      </div>
      <div class="divider"></div>
      <div class="row" style="gap:10px;">
        <div style="width:38px;height:38px;border-radius:50%;background:#FFE3D6;display:flex;
                    align-items:center;justify-content:center;font-size:18px;">🧑</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;">林同学 <span class="badge blue" style="margin-left:4px;">卖家</span></div>
          <div class="muted" style="margin-top:2px;">6 号楼 · 已成交 12 单 · 无违约记录</div>
        </div>
        <span class="btn small ghost" style="padding:0 12px;">主页</span>
      </div>
    </div>

    <div class="card" style="margin-top:12px;padding:14px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px;">商品描述</div>
      <div style="font-size:13px;line-height:21px;color:#5B6472;">
        买来用了两个月，键帽无磨损，蓝牙连三台设备都正常。原包装和说明书都在，
        宿舍楼下自提，可以当面验货。
      </div>
    </div>

    <div class="notice info" style="margin-top:12px;">
      <span>ℹ️</span>
      <span>预约成功后需等卖家在 24 小时内确认；确认后请在 24 小时内下单，否则订单自动取消并记违约。</span>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;
              border-top:1px solid #EDEFF3;display:flex;align-items:center;gap:12px;padding:0 16px 10px;">
    <div style="text-align:center;font-size:10px;color:#5B6472;"><div style="font-size:19px;">💬</div>咨询</div>
    <div style="text-align:center;font-size:10px;color:#5B6472;"><div style="font-size:19px;">⭐</div>收藏</div>
    <div class="btn primary" style="flex:1;">立即预约</div>
  </div>
</div></body></html>
