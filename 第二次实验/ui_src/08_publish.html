<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<title>发布商品</title></head>
<body><div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●●● ⌁ ▭</span></div>
  <div class="navbar"><span class="back">‹</span><span class="title">发布商品</span><span class="right">?</span></div>

  <div class="content" style="padding:12px 14px 96px;height:calc(844px - 44px - 44px);overflow:hidden;">
    <div class="card" style="padding:14px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;">商品图片 <span class="muted" style="font-weight:400;">（最多 6 张，第一张为封面）</span></div>
      <div class="row" style="gap:10px;">
        <div class="thumb g1" style="width:84px;height:84px;font-size:26px;">⌨️</div>
        <div class="thumb g2" style="width:84px;height:84px;font-size:26px;background:#F0F2F5;color:#9AA2B1;">🖼</div>
        <div style="width:84px;height:84px;border:1px dashed #C9CFDA;border-radius:10px;display:flex;
                    flex-direction:column;align-items:center;justify-content:center;color:#9AA2B1;">
          <span style="font-size:22px;">＋</span><span style="font-size:11px;margin-top:2px;">添加</span>
        </div>
      </div>
    </div>

    <div class="field" style="margin-top:12px;">
      <div class="frow"><span class="label">标题</span><span class="value">罗技 K380 蓝牙键盘，九成新，手感很好</span></div>
      <div class="frow" style="height:auto;padding:12px 0;align-items:flex-start;">
        <span class="label" style="padding-top:2px;">描述</span>
        <span class="value" style="font-size:13px;line-height:20px;color:#5B6472;">
          买来用了两个月，键帽无磨损，蓝牙连三台设备都正常。原包装和说明书都在，宿舍楼下自提。
        </span>
      </div>
      <div class="frow">
        <span class="label">分类标签</span>
        <span class="value row" style="gap:8px;">
          <span class="chip active">数码</span><span class="chip">键盘</span><span class="chip">＋</span>
        </span>
      </div>
      <div class="frow">
        <span class="label">价格</span>
        <span class="value price"><span class="sym">¥</span><span class="num" style="font-size:18px;">120</span>
          <span class="muted" style="font-weight:400;margin-left:8px;">参考同款均价 ¥180</span></span>
      </div>
      <div class="frow"><span class="label">交易方式</span><span class="value">校内当面交易 · 自提</span></div>
    </div>

    <div class="notice info" style="margin-top:12px;">
      <span>ℹ️</span>
      <span>提交后进入「待审核」，管理员通过才会上架。被驳回会记违约一次，6 个月内累计 5 次将被封禁。</span>
    </div>

    <div class="card" style="margin-top:12px;padding:12px 14px;">
      <div class="between">
        <span style="font-size:12px;color:#5B6472;">当前状态</span>
        <span class="badge gray">草稿</span>
      </div>
      <div class="muted" style="margin-top:6px;">草稿只有你自己能看到，随时可以继续编辑。</div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #EDEFF3;
              display:flex;align-items:center;gap:12px;padding:0 16px 10px;">
    <div class="btn ghost" style="flex:1;">保存草稿</div>
    <div class="btn primary" style="flex:1.4;">提交审核</div>
  </div>
</div></body></html>
