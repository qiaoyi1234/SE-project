<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<title>登录 / 注册</title></head>
<body><div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● ⌁ ▭</span></div>

  <div style="padding:46px 28px 0;">
    <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#FF8A5B,#FF5A1F);
                display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;letter-spacing:1px;
                box-shadow:0 10px 24px rgba(255,90,31,.28);">二手</div>
    <div style="font-size:26px;font-weight:700;margin-top:22px;letter-spacing:1px;">校园二手</div>
    <div style="font-size:13px;color:#9AA2B1;margin-top:8px;">同校当面交易 · 先预约再下单</div>
  </div>

  <div style="padding:34px 24px 0;">
    <div class="card" style="padding:6px 16px;">
      <div class="frow" style="border-bottom:1px solid #EDEFF3;">
        <span style="width:22px;color:#9AA2B1;">👤</span>
        <input style="border:none;outline:none;flex:1;font-size:15px;font-family:inherit;" value="138****6621">
      </div>
      <div class="frow">
        <span style="width:22px;color:#9AA2B1;">🔒</span>
        <input style="border:none;outline:none;flex:1;font-size:15px;font-family:inherit;" type="password" value="••••••••">
      </div>
    </div>

    <div class="between" style="margin:14px 2px 18px;">
      <span style="font-size:12px;color:#9AA2B1;">角色：买家 / 卖家（注册时选择）</span>
      <span style="font-size:12px;color:#FF5A1F;">忘记密码</span>
    </div>

    <div class="btn primary" style="box-shadow:0 8px 20px rgba(255,90,31,.25);">登录</div>

    <div class="notice warn" style="margin-top:18px;">
      <span>⚠️</span>
      <span>同一账号连续登录失败 5 次将锁定 30 分钟，锁定期间输入正确密码也会被拒绝。</span>
    </div>

    <div style="text-align:center;margin-top:22px;font-size:13px;color:#5B6472;">
      还没有账号？<span style="color:#FF5A1F;font-weight:600;">立即注册</span>
    </div>
  </div>

  <div style="position:absolute;bottom:120px;left:0;right:0;display:flex;justify-content:center;gap:22px;font-size:12px;color:#5B6472;">
    <span>🛡 校园认证</span><span>🤝 当面验货</span><span>📦 先约后买</span>
  </div>
  <div style="position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;color:#B7BDC9;line-height:18px;">
    登录即表示同意《用户协议》《隐私政策》<br>本系统仅记录线下交易，不涉及在线支付
  </div>
</div></body></html>
