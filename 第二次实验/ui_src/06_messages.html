<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<title>消息中心</title></head>
<body><div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●●● ⌁ ▭</span></div>
  <div class="navbar"><span class="back">‹</span><span class="title">消息</span><span class="right">✓</span></div>

  <div style="background:#fff;display:flex;gap:20px;padding:0 16px;border-bottom:1px solid #EDEFF3;">
    <div style="padding:12px 0;font-size:14px;font-weight:600;color:#FF5A1F;border-bottom:2px solid #FF5A1F;">全部 4</div>
    <div style="padding:12px 0;font-size:14px;color:#5B6472;">交易 3</div>
    <div style="padding:12px 0;font-size:14px;color:#5B6472;">系统 1</div>
  </div>

  <div class="content" style="height:calc(844px - 44px - 44px - 45px);padding:0;">
    <div style="background:#fff;">
      <div class="row" style="gap:12px;padding:16px;border-bottom:1px solid #F3F4F7;">
        <div style="width:42px;height:42px;border-radius:12px;background:#E9F7EF;display:flex;
                    align-items:center;justify-content:center;font-size:20px;">✅</div>
        <div style="flex:1;">
          <div class="between">
            <span style="font-size:14px;font-weight:600;">卖家已确认你的预约</span>
            <span class="muted">刚刚</span>
          </div>
          <div style="font-size:12px;color:#5B6472;margin-top:4px;line-height:18px;">
            罗技 K380 键盘已进入「交易中」，请在 24 小时内下单，超时将自动取消并记违约。
          </div>
        </div>
        <span style="width:8px;height:8px;border-radius:50%;background:#DC2626;align-self:flex-start;margin-top:4px;"></span>
      </div>

      <div class="row" style="gap:12px;padding:16px;border-bottom:1px solid #F3F4F7;">
        <div style="width:42px;height:42px;border-radius:12px;background:#FEF3E2;display:flex;
                    align-items:center;justify-content:center;font-size:20px;">⏰</div>
        <div style="flex:1;">
          <div class="between">
            <span style="font-size:14px;font-weight:600;">预约即将超时</span>
            <span class="muted">10 分钟前</span>
          </div>
          <div style="font-size:12px;color:#5B6472;margin-top:4px;line-height:18px;">
            你对「考研数学全套教材」的预约将在 2 小时后失效，可提醒卖家尽快确认。
          </div>
        </div>
        <span style="width:8px;height:8px;border-radius:50%;background:#DC2626;align-self:flex-start;margin-top:4px;"></span>
      </div>

      <div class="row" style="gap:12px;padding:16px;border-bottom:1px solid #F3F4F7;">
        <div style="width:42px;height:42px;border-radius:12px;background:#FDECEC;display:flex;
                    align-items:center;justify-content:center;font-size:20px;">🚫</div>
        <div style="flex:1;">
          <div class="between">
            <span style="font-size:14px;font-weight:600;">商品已被管理员下架</span>
            <span class="muted">昨天 20:12</span>
          </div>
          <div style="font-size:12px;color:#5B6472;margin-top:4px;line-height:18px;">
            「宿舍折叠椅」因违规被下架，该商品下的有效预约与未完成订单已作废，联系方式已回收。
          </div>
        </div>
      </div>

      <div class="row" style="gap:12px;padding:16px;border-bottom:1px solid #F3F4F7;">
        <div style="width:42px;height:42px;border-radius:12px;background:#EAF1FE;display:flex;
                    align-items:center;justify-content:center;font-size:20px;">📋</div>
        <div style="flex:1;">
          <div class="between">
            <span style="font-size:14px;font-weight:600;">操作记录已生成</span>
            <span class="muted">10-28</span>
          </div>
          <div style="font-size:12px;color:#5B6472;margin-top:4px;line-height:18px;">
            你的「预约 → 取消」操作已记录，可在「我的-操作记录」中查询，保存至交易完成后 1 年。
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><span class="ico">🏠</span>首页</div>
    <div class="tab active"><span class="ico">💬</span>消息</div>
    <div class="tab"><span class="ico">📅</span>预约</div>
    <div class="tab"><span class="ico">👤</span>我的</div>
  </div>
</div></body></html>
