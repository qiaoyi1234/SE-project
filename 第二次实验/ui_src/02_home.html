<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<title>买家首页</title></head>
<body><div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●●● ⌁ ▭</span></div>

  <div style="background:#fff;padding:2px 14px 10px;border-bottom:1px solid #EDEFF3;">
    <div class="row" style="gap:10px;">
      <div class="search" style="flex:1;"><span>🔍</span><span>搜一搜：机械键盘 / 考研书 / 台灯</span></div>
      <span style="font-size:18px;">⚙️</span>
    </div>
    <div class="row" style="gap:8px;margin-top:10px;overflow:hidden;">
      <span class="chip active">全部</span>
      <span class="chip">数码</span>
      <span class="chip">图书</span>
      <span class="chip">生活</span>
      <span class="chip">运动</span>
    </div>
    <div class="row" style="gap:8px;margin-top:8px;overflow:hidden;">
      <span class="chip">价格不限</span>
      <span class="chip active">0–50</span>
      <span class="chip">50–200</span>
      <span class="chip">200 以上</span>
      <span class="chip">只看在售</span>
    </div>
  </div>

  <div class="content" style="padding:12px 14px 80px;height:calc(844px - 44px - 150px);">
    <div class="between" style="margin-bottom:10px;">
      <span style="font-size:13px;color:#5B6472;">为你推荐 <b style="color:#1F2430;">128</b> 件</span>
      <span class="muted">按发布时间 ⌄</span>
    </div>

    <div class="grid2">
      <div class="pcard">
        <div class="thumb g1" style="height:118px;">⌨️</div>
        <div class="info">
          <div class="name">罗技 K380 蓝牙键盘，九成新，手感很好</div>
          <div class="meta"><span class="price"><span class="sym">¥</span><span class="num">120</span></span><span class="badge green">在售</span></div>
        </div>
      </div>
      <div class="pcard">
        <div class="thumb g2" style="height:118px;">📚</div>
        <div class="info">
          <div class="name">考研数学全套教材 + 真题，无笔记</div>
          <div class="meta"><span class="price"><span class="sym">¥</span><span class="num">45</span></span><span class="badge amber">已预约</span></div>
        </div>
      </div>
      <div class="pcard">
        <div class="thumb g3" style="height:118px;">💡</div>
        <div class="info">
          <div class="name">宿舍护眼台灯，三档调光，可小刀</div>
          <div class="meta"><span class="price"><span class="sym">¥</span><span class="num">35</span></span><span class="badge green">在售</span></div>
        </div>
      </div>
      <div class="pcard">
        <div class="thumb g4" style="height:118px;">👟</div>
        <div class="info">
          <div class="name">跑鞋 42 码，只穿过两次，鞋盒在</div>
          <div class="meta"><span class="price"><span class="sym">¥</span><span class="num">180</span></span><span class="badge green">在售</span></div>
        </div>
      </div>
    </div>

    <div style="text-align:center;font-size:11px;color:#9AA2B1;padding:14px 0 4px;">已显示 4 / 128 件 · 上滑加载更多</div>
  </div>

  <div class="tabbar">
    <div class="tab active"><span class="ico">🏠</span>首页</div>
    <div class="tab"><span class="ico">💬</span>消息</div>
    <div class="tab"><span class="ico">📅</span>预约</div>
    <div class="tab"><span class="ico">👤</span>我的</div>
  </div>
</div></body></html>
